version: v0.4
project:
  name: Fisher midpoint rigidity in exponential families
  description: >-
    In a finite-dimensional regular exponential family with a flat Fisher chart,
    replace two nearby parameters by their natural and expectation averages.
    Preservation of their Fisher midpoint forces the sufficient statistic, after
    a fixed invertible affine change, to have independent Gaussian location and
    fixed-shape gamma coordinates. Equidistance from the original endpoints
    suffices, as does vanishing of just the longitudinal fourth-order displacement.
    The hypothesis on one open patch determines the complete Laplace finiteness
    domain and the law under every admissible natural tilt. The canonical products
    preserve the Fisher midpoint for every pair.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
