fidelity:
  divergences: >-
    Riemannian flatness and regularity are expressed in a supplied Euclidean Fisher
    chart on a connected open set, with invertible C4 natural and expectation charts.
    Their metric pairing and the gradient of the actual log-Laplace transform are
    explicit hypotheses. Connection coefficients, their commutation and parallelism,
    the affine statistic, independence, and the maximal domain are derived.
    The input measure is the law of the sufficient statistic at one reference member.
    The converse uses the global natural and expectation coordinates of the canonical
    products. Symbolic examples in the separate exact replay illustrate these theorems.
